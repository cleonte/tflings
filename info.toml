# The exercises, in learning order. Order matters; do not append at the end by habit.

[[exercises]]
name      = "iac1"
path      = "exercises/iac/iac1"
topic     = "iac"
mode      = "quiz"
objective = "1a"
hint      = "Think about what the code in the name stands for: a description of the infrastructure you want, kept in files."
docs      = "https://developer.hashicorp.com/terraform/tutorials/certification-004/associate-review-004"

[[exercises]]
name      = "hcl1"
path      = "exercises/hcl/hcl1"
topic     = "hcl"
mode      = "plan"
objective = "4a"
hint      = "Read the line number in Terraform's error. A string that is opened has to be closed on the same line."
docs      = "https://developer.hashicorp.com/terraform/language/syntax/configuration"

[[exercises]]
name      = "fmt1"
path      = "exercises/fmt/fmt1"
topic     = "fmt"
mode      = "plan"
objective = "3g"
hint      = "Two-space indentation, one space on each side of =, and the = signs of neighbouring arguments line up."
docs      = "https://developer.hashicorp.com/terraform/cli/commands/fmt"

[[exercises]]
name      = "variables1"
path      = "exercises/variables/variables1"
topic     = "variables"
mode      = "plan"
objective = "4c"
hint      = "A variable that has a default never needs to be asked for."
docs      = "https://developer.hashicorp.com/terraform/language/values/variables"

[[exercises]]
name      = "variables2"
path      = "exercises/variables/variables2"
topic     = "variables"
mode      = "plan"
objective = "4c"
hint      = "The type says number, so the default has to be a number, not text that looks like one."
docs      = "https://developer.hashicorp.com/terraform/language/values/variables#type-constraints"

[[exercises]]
name      = "outputs1"
path      = "exercises/outputs/outputs1"
topic     = "outputs"
mode      = "plan"
objective = "4c"
hint      = "length() works on a map, and on a resource that has for_each."
docs      = "https://developer.hashicorp.com/terraform/language/values/outputs"

[[exercises]]
name      = "outputs2"
path      = "exercises/outputs/outputs2"
topic     = "outputs"
mode      = "plan"
objective = "4d"
hint      = "A resource with count is a list of instances: use the splat expression resource.name[*].attribute."
docs      = "https://developer.hashicorp.com/terraform/language/expressions/splat"

[[exercises]]
name      = "types1"
path      = "exercises/types/types1"
topic     = "types"
mode      = "plan"
objective = "4d"
hint      = "A list is written with square brackets, with its elements separated by commas."
docs      = "https://developer.hashicorp.com/terraform/language/expressions/type-constraints"

[[exercises]]
name      = "expressions1"
path      = "exercises/expressions/expressions1"
topic     = "expressions"
mode      = "plan"
objective = "4e"
hint      = "condition ? value_if_true : value_if_false, with a comparison using == as the condition."
docs      = "https://developer.hashicorp.com/terraform/language/expressions/conditionals"

[[exercises]]
name      = "expressions2"
path      = "exercises/expressions/expressions2"
topic     = "expressions"
mode      = "plan"
objective = "4e"
hint      = "lookup(map, key, default) returns the default when the key is missing; try() does the same for any expression that fails."
docs      = "https://developer.hashicorp.com/terraform/language/functions/lookup"

[[exercises]]
name      = "functions1"
path      = "exercises/functions/functions1"
topic     = "functions"
mode      = "plan"
objective = "4e"
hint      = "The function is called upper."
docs      = "https://developer.hashicorp.com/terraform/language/functions"

[[exercises]]
name      = "functions2"
path      = "exercises/functions/functions2"
topic     = "functions"
mode      = "plan"
objective = "4e"
hint      = "merge(a, b) combines maps; keys of the later map win."
docs      = "https://developer.hashicorp.com/terraform/language/functions/merge"

[[exercises]]
name      = "functions3"
path      = "exercises/functions/functions3"
topic     = "functions"
mode      = "plan"
objective = "4e"
hint      = "cidrsubnet(prefix, newbits, netnum): newbits=8 turns a /16 into /24 subnets; netnum counts from 0."
docs      = "https://developer.hashicorp.com/terraform/language/functions/cidrsubnet"

[[exercises]]
name      = "resources1"
path      = "exercises/resources/resources1"
topic     = "resources"
mode      = "plan"
objective = "4a"
requires  = ["floci"]
hint      = "Look in the documentation of aws_s3_bucket for the name of the argument that sets the bucket's name."
docs      = "https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/s3_bucket"

[[exercises]]
name      = "resources2"
path      = "exercises/resources/resources2"
topic     = "resources"
mode      = "apply"
objective = "4a"
hint      = "Look for a resource called aws_s3_bucket_versioning in the provider documentation. It points at the bucket by reference."
docs      = "https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/s3_bucket_versioning"

[[exercises]]
name      = "resources3"
path      = "exercises/resources/resources3"
topic     = "resources"
mode      = "apply"
objective = "4a"
hint      = "Tags are a map: each entry is NAME = \"value\". The map is an argument of the VPC."
docs      = "https://developer.hashicorp.com/terraform/language/resources/syntax"

[[exercises]]
name      = "references1"
path      = "exercises/references/references1"
topic     = "references"
mode      = "apply"
objective = "4b"
hint      = "The object's bucket can be the id of the bucket resource: look at how a resource's attributes are written, TYPE.NAME.ATTRIBUTE."
docs      = "https://developer.hashicorp.com/terraform/language/expressions/references"

[[exercises]]
name      = "references2"
path      = "exercises/references/references2"
topic     = "references"
mode      = "apply"
objective = "4b"
hint      = "The VPC resource has an id attribute, and a subnet takes a vpc_id."
docs      = "https://developer.hashicorp.com/terraform/language/expressions/references"

[[exercises]]
name      = "references3"
path      = "exercises/references/references3"
topic     = "references"
mode      = "plan"
objective = "4b"
hint      = "terraform_data keeps the value you gave it in an attribute named after the argument. Check the docs of the resource."
docs      = "https://developer.hashicorp.com/terraform/language/resources/terraform-data"

[[exercises]]
name      = "iteration1"
path      = "exercises/iteration/iteration1"
topic     = "iteration"
mode      = "plan"
objective = "4e"
hint      = "count = length(...) gives one copy per element; count.index is the position in the list."
docs      = "https://developer.hashicorp.com/terraform/language/meta-arguments/count"

[[exercises]]
name      = "iteration2"
path      = "exercises/iteration/iteration2"
topic     = "iteration"
mode      = "plan"
objective = "4e"
hint      = "for_each takes a map or a set; each.key and each.value are the current entry."
docs      = "https://developer.hashicorp.com/terraform/language/meta-arguments/for_each"

[[exercises]]
name      = "iteration3"
path      = "exercises/iteration/iteration3"
topic     = "iteration"
mode      = "plan"
objective = "4e"
requires  = ["floci"]
hint      = "A dynamic block has a for_each and a content block; inside, the iterator is named after the block (ingress.value)."
docs      = "https://developer.hashicorp.com/terraform/language/expressions/dynamic-blocks"

[[exercises]]
name      = "iteration4"
path      = "exercises/iteration/iteration4"
topic     = "iteration"
mode      = "plan"
objective = "4e"
hint      = "count = var.enabled ? 1 : 0 builds the resource once or not at all."
docs      = "https://developer.hashicorp.com/terraform/language/meta-arguments/count"

[[exercises]]
name      = "iteration5"
path      = "exercises/iteration/iteration5"
topic     = "iteration"
mode      = "plan"
objective = "4e"
hint      = "for_each needs a map or a set of strings. toset() turns a list into a set; each.key is the current element."
docs      = "https://developer.hashicorp.com/terraform/language/meta-arguments/for_each"

[[exercises]]
name      = "iteration6"
path      = "exercises/iteration/iteration6"
topic     = "iteration"
mode      = "plan"
objective = "4e"
hint      = "A for expression over a map: { for k, v in var.servers : upper(k) => v }."
docs      = "https://developer.hashicorp.com/terraform/language/expressions/for"

[[exercises]]
name      = "data-sources1"
path      = "exercises/data-sources/data-sources1"
topic     = "data-sources"
mode      = "apply"
objective = "4a"
hint      = "The data source aws_caller_identity has an attribute called account_id. A data block is referred to as data.TYPE.NAME.ATTRIBUTE."
docs      = "https://registry.terraform.io/providers/hashicorp/aws/latest/docs/data-sources/caller_identity"

[[exercises]]
name      = "dependencies1"
path      = "exercises/dependencies/dependencies1"
topic     = "dependencies"
mode      = "plan"
objective = "4f"
hint      = "The meta-argument is called depends_on and takes a list of resource addresses."
docs      = "https://developer.hashicorp.com/terraform/language/meta-arguments/depends_on"

[[exercises]]
name      = "dependencies2"
path      = "exercises/dependencies/dependencies2"
topic     = "dependencies"
mode      = "plan"
objective = "4a"
hint      = "An argument that uses an attribute of another resource makes Terraform build that one first. No depends_on needed."
docs      = "https://developer.hashicorp.com/terraform/language/resources/behavior#resource-dependencies"

[[exercises]]
name      = "lifecycle1"
path      = "exercises/lifecycle/lifecycle1"
topic     = "lifecycle"
mode      = "plan"
objective = "4a"
hint      = "The lifecycle block takes create_before_destroy = true."
docs      = "https://developer.hashicorp.com/terraform/language/meta-arguments/lifecycle"

[[exercises]]
name      = "lifecycle2"
path      = "exercises/lifecycle/lifecycle2"
topic     = "lifecycle"
mode      = "plan"
objective = "4a"
hint      = "The lifecycle block takes prevent_destroy = true."
docs      = "https://developer.hashicorp.com/terraform/language/meta-arguments/lifecycle"

[[exercises]]
name      = "lifecycle3"
path      = "exercises/lifecycle/lifecycle3"
topic     = "lifecycle"
mode      = "plan"
objective = "4a"
hint      = "ignore_changes takes a list of the attributes to leave alone, written without quotes."
docs      = "https://developer.hashicorp.com/terraform/language/meta-arguments/lifecycle"

[[exercises]]
name      = "lifecycle4"
path      = "exercises/lifecycle/lifecycle4"
topic     = "lifecycle"
mode      = "plan"
objective = "4a"
hint      = "replace_triggered_by takes a list of references to the resources whose change should cause a replacement."
docs      = "https://developer.hashicorp.com/terraform/language/meta-arguments/lifecycle"

[[exercises]]
name      = "conditions1"
path      = "exercises/conditions/conditions1"
topic     = "conditions"
mode      = "plan"
objective = "4c"
hint      = "Put a validation block inside the variable, with a condition and an error_message."
docs      = "https://developer.hashicorp.com/terraform/language/expressions/custom-conditions#input-variable-validation"

[[exercises]]
name      = "conditions2"
path      = "exercises/conditions/conditions2"
topic     = "conditions"
mode      = "plan"
objective = "4e"
hint      = "A precondition goes inside the resource's lifecycle block; contains() tests list membership."
docs      = "https://developer.hashicorp.com/terraform/language/expressions/custom-conditions#preconditions-and-postconditions"

[[exercises]]
name      = "conditions3"
path      = "exercises/conditions/conditions3"
topic     = "conditions"
mode      = "plan"
objective = "4e"
hint      = "The precondition block goes inside the output block; % is the remainder operator."
docs      = "https://developer.hashicorp.com/terraform/language/expressions/custom-conditions#preconditions-and-postconditions"

[[exercises]]
name      = "conditions4"
path      = "exercises/conditions/conditions4"
topic     = "conditions"
mode      = "plan"
objective = "4e"
hint      = "check \"name\" { assert { condition = ... error_message = ... } }"
docs      = "https://developer.hashicorp.com/terraform/language/block/check"

[[exercises]]
name      = "providers1"
path      = "exercises/providers/providers1"
topic     = "providers"
mode      = "plan"
objective = "2b"
requires  = ["floci"]
hint      = "Add a second provider \"aws\" block with alias = \"west\" and region = \"us-west-2\"."
docs      = "https://developer.hashicorp.com/terraform/language/block/provider#alias-multiple-provider-configurations"

[[exercises]]
name      = "providers2"
path      = "exercises/providers/providers2"
topic     = "providers"
mode      = "plan"
objective = "2b"
requires  = ["floci"]
hint      = "~> 6.0 allows 6.0 and newer, below 7.0."
docs      = "https://developer.hashicorp.com/terraform/language/expressions/version-constraints"

[[exercises]]
name      = "versions1"
path      = "exercises/versions/versions1"
topic     = "versions"
mode      = "plan"
objective = "2b"
hint      = "required_version = \"~> 1.12\" allows 1.12 and newer, below 2.0."
docs      = "https://developer.hashicorp.com/terraform/language/expressions/version-constraints"

[[exercises]]
name      = "sensitive1"
path      = "exercises/sensitive/sensitive1"
topic     = "sensitive"
mode      = "plan"
objective = "4d"
hint      = "Add sensitive = true to the variable."
docs      = "https://developer.hashicorp.com/terraform/language/values/variables#suppressing-values-in-cli-output"

[[exercises]]
name      = "sensitive2"
path      = "exercises/sensitive/sensitive2"
topic     = "sensitive"
mode      = "plan"
objective = "4d"
hint      = "The output needs sensitive = true too. Do not remove the sensitivity of the variable."
docs      = "https://developer.hashicorp.com/terraform/language/values/outputs#sensitive-suppressing-values-in-cli-output"

[[exercises]]
name      = "sensitive3"
path      = "exercises/sensitive/sensitive3"
topic     = "sensitive"
mode      = "apply"
objective = "4d"
requires  = ["floci"]
hint      = "aws_ssm_parameter has value_wo and value_wo_version instead of value."
docs      = "https://developer.hashicorp.com/terraform/language/manage-sensitive-data/ephemeral"

[[exercises]]
name      = "sensitive4"
path      = "exercises/sensitive/sensitive4"
topic     = "sensitive"
mode      = "apply"
objective = "4d"
requires  = ["floci"]
hint      = "aws_secretsmanager_secret_version has secret_string_wo and secret_string_wo_version."
docs      = "https://developer.hashicorp.com/terraform/language/manage-sensitive-data/ephemeral"

[[exercises]]
name      = "refactoring1"
path      = "exercises/refactoring/refactoring1"
topic     = "refactoring"
mode      = "fix"
objective = "6d"
hint      = "terraform state mv OLD NEW changes the name of an object in the state without touching the real thing."
docs      = "https://developer.hashicorp.com/terraform/cli/commands/state/mv"

[[exercises]]
name      = "drift1"
path      = "exercises/drift/drift1"
topic     = "drift"
mode      = "fix"
objective = "7a"
requires  = ["floci"]
hint      = "A normal apply refreshes first, then changes the real thing to match the configuration."
docs      = "https://developer.hashicorp.com/terraform/tutorials/state/resource-drift"

[[exercises]]
name      = "drift2"
path      = "exercises/drift/drift2"
topic     = "drift"
mode      = "fix"
objective = "7a"
requires  = ["floci"]
hint      = "apply -refresh-only updates the state from the real thing without changing anything real. Then make main.tf agree."
docs      = "https://developer.hashicorp.com/terraform/tutorials/state/resource-drift"

[[exercises]]
name      = "refactoring2"
path      = "exercises/refactoring/refactoring2"
topic     = "refactoring"
mode      = "fix"
objective = "6d"
hint      = "A moved block has from and to, written as resource addresses. Apply it; do not run state mv."
docs      = "https://developer.hashicorp.com/terraform/language/modules/develop/refactoring"

[[exercises]]
name      = "drift3"
path      = "exercises/drift/drift3"
topic     = "drift"
mode      = "fix"
objective = "7a"
requires  = ["floci"]
hint      = "The configuration is right and the parameter is gone. What does a plan do with something the configuration has and the world does not?"
docs      = "https://developer.hashicorp.com/terraform/tutorials/state/resource-drift"

[[exercises]]
name      = "import1"
path      = "exercises/import/import1"
topic     = "import"
mode      = "fix"
objective = "7a"
requires  = ["floci"]
hint      = "terraform import ADDRESS ID attaches an existing object to a resource. Then read what the next plan still wants."
docs      = "https://developer.hashicorp.com/terraform/cli/import"

[[exercises]]
name      = "locking1"
path      = "exercises/locking/locking1"
topic     = "locking"
mode      = "fix"
objective = "6c"
requires  = ["floci"]
hint      = "The error shows the lock ID. terraform force-unlock releases a lock; -lock=false only ignores it."
docs      = "https://developer.hashicorp.com/terraform/cli/commands/force-unlock"
