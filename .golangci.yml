version: "2"
linters:
  default: standard   # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
  settings:
    errcheck:
      # The mock exam writes questions and results to the terminal; there is
      # nothing to do about a failed write there.
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
formatters:
  enable:
    - gofmt
