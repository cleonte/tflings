name: versions

# Weekly: is there a newer Floci, AWS provider or Terraform than the ones tflings
# pins and was proven on? It only reports (a red run and a warning); it opens no
# issue and changes nothing. Bumping a pin is a deliberate change that has to be
# proven by ci.yml.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  newer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-versions.sh
