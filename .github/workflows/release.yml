name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # A tag is published only if the tests pass: the unit tests, the exercise
  # lint, and the proof that every provider-free exercise fails as shipped and
  # passes with its solution, on the exam's Terraform (1.12). The exercises that
  # need Floci are proven by the aws job of ci.yml, not here.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.12.0"
          terraform_wrapper: false
      - name: Tests
        env:
          TFLINGS_SKIP_DOCKER: "1"
        run: go test ./...

  goreleaser:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      # The body of the release is its section of CHANGELOG.md. A tag without a
      # section gets the notes GoReleaser generates from the commits.
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          if scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"; then
            echo "flags=--release-notes=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"
          else
            echo "CHANGELOG.md has no section for $GITHUB_REF_NAME: GoReleaser generates the notes."
          fi

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean ${{ steps.notes.outputs.flags }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A token that can push to the tap (cleonte/homebrew-tap); the GITHUB_TOKEN of
          # a workflow cannot write to another repository. See CONTRIBUTING.md, Releasing.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
