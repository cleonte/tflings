files:
  - expr: files["main.tf"].matches("(?m)^\\s*backend\\s+\"local\"") && files["main.tf"].matches("(?m)^\\s*path\\s*=\\s*\"state/app\\.tfstate\"")
    message: "main.tf should keep the local backend with path = \"state/app.tfstate\"."
state:
  - expr: state.values.root_module.resources.exists(r, r.address == "terraform_data.app")
    message: "terraform_data.app is not in the state of the new backend. The state has to be copied to state/app.tfstate."
  - expr: state.values.root_module.resources.filter(r, r.address == "terraform_data.app").all(r, r.values.id == seed.values.root_module.resources.filter(s, s.address == "terraform_data.app")[0].values.id)
    message: "terraform_data.app was built again. The existing state has to move to the new file."
empty_plan_after: true
explanation: >-
  The local backend keeps the state in a file, by default `terraform.tfstate`;
  `path` changes where. When a backend setting changes, `terraform init` must be
  run again, and `-migrate-state` copies the state from the old place to the new
  one. Without it the new file starts empty and Terraform would build everything
  again.
