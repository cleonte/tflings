files:
  - expr: files["main.tf"].matches("(?m)^\\s*moved\\s*\\{")
    message: "Use a moved block in main.tf, so that everyone who shares this configuration gets the move."
state:
  - expr: state.values.root_module.child_modules.exists(m, m.address == "module.web" && m.resources.exists(r, r.address == "module.web.terraform_data.this" && r.values.id == seed.values.root_module.resources.filter(s, s.address == "terraform_data.web")[0].values.id))
    message: "The server should now live in module.web, and be the same object as before."
  - expr: "!has(state.values.root_module.resources) || !state.values.root_module.resources.exists(r, r.address == \"terraform_data.web\")"
    message: "terraform_data.web should no longer be in the root module."
empty_plan_after: true
explanation: >-
  Moving a resource into a module changes its address, from terraform_data.web
  to module.web.terraform_data.this. A moved block tells Terraform the object is
  the same, so nothing is destroyed.
