plan:
  - expr: plan.planned_values.outputs.port_count.value == 2
    message: "port_count should be 2."
  - expr: plan.planned_values.outputs.label.value == "web:80"
    message: "label should be web:80."
files:
  - expr: files["main.tf"].matches("(?m)^\\s*type\\s*=") && !files["main.tf"].matches("(?m)^\\s*type\\s*=\\s*any\\b")
    message: "Give the variable a type that says what each attribute holds: not any, and not left out."
variants:
  - vars: { app: '{ name = "api", ports = [8080, 8081, 8082] }' }
    plan:
      - expr: plan.planned_values.outputs.port_count.value == 3 && plan.planned_values.outputs.label.value == "api:8080"
        message: "The outputs should follow the variable: do not change the default to fit."
explanation: >-
  `map(T)` needs every value to have the same type T. An `object` lists its
  attributes and gives each one a type, so it can hold a string and a list
  together. Terraform converts a value to the declared type when it can and
  fails when it cannot.
