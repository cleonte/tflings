[[question]]
id = "b3-2d-1"
objective = "2d"
text = "Which TWO are reasons to use a remote backend instead of the local one?"
options = [
  "The team shares one state",
  "State locking and access control",
  "The state is smaller",
  "Terraform runs faster on remote state",
]
correct = [0, 1]
explanation = "A remote backend makes the state available to the team and usually adds locking, encryption and permissions."

[[question]]
id = "b3-4d-1"
