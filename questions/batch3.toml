[[question]]
id = "b3-7b-3"
objective = "7b"
text = "What does `terraform providers` show?"
options = [
  "The providers that the configuration and its modules require",
  "The state of providers",
  "The provider logs",
  "The provider credentials",
]
correct = [0]
