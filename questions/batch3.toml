[[question]]
id = "b3-3d-1"
objective = "3d"
text = "What does `terraform plan -destroy` do?"
options = [
  "Shows what a destroy would remove, without destroying",
  "Destroys after confirmation",
  "Deletes the plan file",
  "Removes the state",
]
correct = [0]
