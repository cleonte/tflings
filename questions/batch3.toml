[[question]]
id = "b3-4e-3"
objective = "4e"
text = "Which function reads the contents of a file as a string?"
options = [
  "file(\"path\")",
  "read(\"path\")",
  "include(\"path\")",
  "fileset(\"path\")",
]
correct = [0]
