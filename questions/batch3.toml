text = "Which function turns a list into a set?"
options = [
  "toset",
  "tolist",
  "tomap",
  "concat",
]
correct = [0]
explanation = "`toset(list)` removes duplicates and loses order. It is often used with `for_each`."

[[question]]
id = "b3-4d-2"
objective = "4d"
text = "Which type constraint describes a map whose values are all strings?"
options = [
  "map(string)",
  "object({ string })",
  "list(string)",
  "set(map)",
]
correct = [0]
explanation = "`map(string)` is keys to strings. An `object` lists its attributes by name."

[[question]]
id = "b3-4b-1"
objective = "4b"
text = "How do you refer to the third element of the list `local.names`?"
options = [
  "local.names[2]",
  "local.names[3]",
  "local.names.3",
  "local[names][2]",
]
correct = [0]
explanation = "Indexes start at 0, so the third element is `[2]`."

[[question]]
id = "b3-4e-1"
objective = "4e"
text = "What does the splat expression `aws_instance.web[*].id` give?"
options = [
  "A list of the ids of all the instances",
  "The id of the first instance",
  "A map of ids",
  "An error",
]
correct = [0]
