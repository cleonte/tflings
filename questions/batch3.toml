[[question]]
id = "b3-3e-1"
objective = "3e"
text = "What does `-target=ADDRESS` do on a plan or apply?"
options = [
  "Limits the operation to that resource and what it depends on; meant for exceptions",
  "Selects the workspace",
  "Selects the provider",
  "Makes the plan faster and safe for every day",
]
correct = [0]
explanation = "Terraform warns that targeting can leave the configuration and the state out of step, so use it for recovery, not for routine work."

[[question]]
id = "b3-5d-1"
objective = "5d"
text = "What does `terraform init -upgrade` do?"
options = [
  "Installs the newest providers and modules that the version constraints allow",
  "Upgrades the Terraform binary",
  "Upgrades the state format and nothing else",
  "Removes the lock file",
]
correct = [0]
explanation = "Without `-upgrade`, init keeps the versions in the lock file. With it, it picks newer ones within the constraints and rewrites the lock file."

