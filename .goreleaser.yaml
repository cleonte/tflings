version: 2

before:
  hooks:
    - go mod tidy
builds:
  - main: ./cmd/tflings
    binary: tflings
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    # main.version, main.commit and main.date are set by GoReleaser's default
    # ldflags; they are what `tflings version` prints.
archives:
  - name_template: >-
      {{- .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end -}}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - NOTICE*
      - README*
      - CHANGELOG*
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-next"
# The body of a release is its section of CHANGELOG.md (the release workflow
# passes it with --release-notes). The generated changelog below is only what a
# tag without a section gets.
release:
  footer: |
    ## Install

    `go install github.com/cleonte/tflings/cmd/tflings@{{ .Tag }}`, `brew install cleonte/tap/tflings` (macOS), or download the archive for your system below and put `tflings` on your PATH. Then run `tflings doctor`, `tflings init` and `tflings watch`.

    Exercises that use the AWS provider need Docker and a one-time `tflings doctor --prefetch` (about 250 MB); `tflings aws up` starts the local AWS emulator (Floci).

# The Homebrew cask in the tap cleonte/homebrew-tap (brew install cleonte/tap/tflings).
# A cask, because GoReleaser deprecated formulas for pre-built binaries (v2.10).
# The binaries are not signed or notarized, so the cask removes the quarantine
# flag that macOS puts on downloads; that is what stops Gatekeeper from refusing
# the first run. The token is a personal access token with write access to the tap
# only: the GITHUB_TOKEN of a workflow cannot push to another repository.
homebrew_casks:
  - name: tflings
    repository:
      owner: cleonte
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/cleonte/tflings
    description: "Learn Terraform through small broken exercises (rustlings for Terraform)"
    license: Apache-2.0
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/tflings"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

